[project]
name = "openrelife"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "setuptools",
    "numpy>=1.26.4",
    "mss==9.0.1",
    "sentence-transformers==3.0.0",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.6.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.17.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.21.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "shapely>=2.0.7",
    "h5py>=3.12.1",
    "rapidfuzz==3.9.3",
    "Pillow>=11.1.0",
    "python-doctr @ git+https://github.com/koenvaneijk/doctr.git@af711bc04eb8876a7189923fb51ec44481ee18cd",
    "requests>=2.31.0",
    "pynput",
    "waitress",
    # Apple Vision OCR backend (macOS only). Kept in main deps so `uv sync` in the
    # bundle picks them up without needing --extra macos.
    "pyobjc-framework-Vision==10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==10.3 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.optional-dependencies]
windows = ["pywin32", "psutil"]
macos = ["pyobjc==10.3"]
linux = []
