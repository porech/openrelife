<link rel="stylesheet" href="/assets/text-dialog.css">
<div class="text-dialog-scrim" id="textDialogScrim" onclick="closeTextDialog()"></div>
<section class="text-dialog" id="textDialog" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="textDialogTitle">
  <header class="td-chrome"><span><i class="bi bi-layers" aria-hidden="true"></i> OpenReLife</span><button type="button" class="td-close" id="textDialogClose" onclick="closeTextDialog()" aria-label="Close screen text"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></header>
  <div class="td-heading"><div><h2 id="textDialogTitle">Screen text</h2><div class="td-meta"><i class="bi bi-window" aria-hidden="true"></i><span id="textDialogApp">Screenshot</span><span aria-hidden="true">·</span><time id="textDialogTs"></time></div></div><div class="td-actions"><button type="button" class="dialog-btn ai" id="btnRunAI" onclick="runAIOCR()"><span class="ai-spinner" aria-hidden="true"></span><i class="bi bi-stars ai-star" aria-hidden="true"></i><span class="run-label">Extract with AI</span></button><button type="button" class="dialog-btn" id="btnCopyText" onclick="copyExtractedText()"><i class="bi bi-clipboard" aria-hidden="true"></i><span class="copy-label">Copy text</span></button></div></div>
  <div class="td-toolbar"><div class="mode-switch" id="sourceSwitch" aria-label="Text source"><button type="button" class="mode-label" id="modeLabelBase" onclick="showOCRMode('basic')" aria-pressed="true"><i class="bi bi-body-text" aria-hidden="true"></i> Local OCR</button><button type="button" class="mode-label" id="modeLabelAi" onclick="showOCRMode('ai')" aria-pressed="false"><i class="bi bi-stars" aria-hidden="true"></i> AI OCR</button></div><span class="td-source-help">Text from this screenshot</span></div>
  <div class="td-workspace">
    <aside class="td-source" aria-label="Captured screen"><div class="td-source-heading">Captured screen <i class="bi bi-image" aria-hidden="true"></i></div><button type="button" class="td-preview" id="textDialogPreview" onclick="closeTextDialog()" aria-label="View the original screenshot"><img id="textDialogImage" alt="" hidden><span id="textDialogImageState">Loading preview…</span><span class="td-preview-caption">View screenshot <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span></button><dl class="td-source-info"><div><dt>Application</dt><dd id="textDialogSourceApp">—</dd></div><div><dt>Window title</dt><dd id="textDialogSourceTitle">—</dd></div><div><dt>Captured at</dt><dd id="textDialogSourceTime">—</dd></div></dl></aside>
    <section class="td-document" aria-labelledby="textDocumentTitle"><header class="td-document-header"><span id="textDocumentTitle"><i class="bi bi-file-earmark-text" aria-hidden="true"></i> Extracted text</span><div class="td-find" id="dialogFind" role="search" aria-label="Find in screen text"><button type="button" class="td-find-btn" id="btnFind" onclick="openDialogFind()" aria-label="Find in text"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4 4"/></svg></button><input type="search" id="dialogFindInput" placeholder="Find in text" aria-label="Find in text" autocomplete="off" maxlength="256" onfocus="document.getElementById('dialogFind').classList.add('show')" oninput="dialogFindRun()" onkeydown="dialogFindKey(event)"><span class="td-find-count" id="dialogFindCount" role="status"></span><button type="button" class="td-find-btn" id="dialogFindPrevious" onclick="dialogFindStep(-1)" aria-label="Previous match" disabled><i class="bi bi-chevron-up" aria-hidden="true"></i></button><button type="button" class="td-find-btn" id="dialogFindNext" onclick="dialogFindStep(1)" aria-label="Next match" disabled><i class="bi bi-chevron-down" aria-hidden="true"></i></button></div></header><div id="textDialogBanner" class="td-banner" role="status"><i class="bi bi-stars" aria-hidden="true"></i> AI transcription</div><div id="extractedText" class="td-body" role="document" aria-label="Extracted screenshot text" tabindex="0"></div><footer class="td-document-footer"><span id="textDialogOrigin">Local OCR</span><span id="textDialogStats"></span><span>Read-only</span></footer></section>
  </div>
  <footer class="td-footer"><span>Text extracted from the captured screen</span><span>Esc to close · ⌘F to find</span></footer>
</section>
<script src="/assets/text-dialog.js" defer></script>
